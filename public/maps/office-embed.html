<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADealForge office location</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #070b14;
        color: #f4f7fb;
      }

      .map {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 28% 32%, rgba(61, 129, 227, 0.22), transparent 42%),
          radial-gradient(circle at 72% 68%, rgba(0, 210, 255, 0.12), transparent 40%),
          linear-gradient(160deg, #0a101c 0%, #0c1422 48%, #09101a 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at center, #000 35%, transparent 85%);
      }

      .pin {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 18px;
        height: 18px;
        border-radius: 50% 50% 50% 0;
        transform: translate(-50%, -50%) rotate(-45deg);
        background: #3d81e3;
        box-shadow: 0 0 0 6px rgba(61, 129, 227, 0.2);
      }

      .pin::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 999px;
        background: #a4f4fd;
      }
    </style>
  </head>
  <body>
    <div class="map" role="img" aria-label="ADealForge Warsaw office map preview">
      <div class="grid" aria-hidden="true"></div>
      <div class="pin" aria-hidden="true"></div>
    </div>
  </body>
</html>
